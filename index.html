  <body>
    <!-- Static first paint: what crawlers, link fetchers, and no-JS readers see.
         React replaces it on mount; until then it doubles as the loading state. -->

      <div class="boot" role="status">
        <span class="boot-mark" aria-hidden="true"></span>
        <h1 class="boot-title">Malzu</h1>
        <p class="boot-line">
          A citation-first map of how malware families relate: forks, shared code, shared operators, loader chains.
          Force-directed (Fruchterman–Reingold).
        </p>

          <style>.boot-mark { display: none; }</style>
          <p class="boot-note">The interactive graph needs JavaScript.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
